name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python
        run: python -m compileall -q app

      - name: Import application
        run: python -c "import app.main; import app.music; import app.dezoom; import app.native_image; import app.diagnostics; import app.analyzer; import app.image_tools; import app.url_utils"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate version consistency
        run: python -c "import json, app; m=json.load(open('extension/manifest.json', encoding='utf-8')); assert app.__version__ == m['version'] == '0.15.0'"

      - name: Validate extension manifest
        run: python -m json.tool extension/manifest.json > /dev/null

      - name: Validate web JavaScript
        run: |
          node --check app/static/app.js
          node --check app/static/viewer.js

      - name: Validate extension JavaScript
        run: |
          for file in extension/*.js; do
            node --check "$file"
          done

      - name: Validate floating helper JavaScript
        run: node --check extension/content.js

      - name: Validate extension background JavaScript
        run: node --check extension/background.js

      - name: Validate popup guard state JavaScript
        run: node --check extension/guard-state.js

      - name: Validate popup guard main-world JavaScript
        run: node --check extension/guard-main.js

      - name: Validate in-page notification JavaScript
        run: node --check extension/notify.js

      - name: Validate context target JavaScript
        run: node --check extension/context-target.js

      - name: Validate native image rules
        run: python -c "from app.native_image import generate_candidates; c=generate_candidates('https://i.pinimg.com/564x/aa/bb/cc/test.jpg'); assert any('/originals/' in x.url for x in c)"

      - name: Validate analyzer cache import
        run: python -c "import app.analyzer; assert app.analyzer.ANALYZE_CACHE_TTL > 0"

      - name: Validate floating image viewer JavaScript
        run: node --check extension/image-viewer.js

      - name: Validate social image scanner JavaScript
        run: node --check extension/social-images.js

      - name: Validate setup helper
        run: python -m app.setup_engines verify
