name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python
        run: python -m compileall -q app

      - name: Import application
        run: python -c "import app.main; import app.music; import app.dezoom; import app.native_image; import app.diagnostics; import app.analyzer; import app.image_tools"

      - name: Validate extension manifest
        run: python -m json.tool extension/manifest.json > /dev/null

      - name: Validate web JavaScript
        run: node --check app/static/app.js

      - name: Validate extension JavaScript
        run: node --check extension/popup.js

      - name: Validate floating helper JavaScript
        run: node --check extension/content.js

      - name: Validate extension background JavaScript
        run: node --check extension/background.js

      - name: Validate popup guard state JavaScript
        run: node --check extension/guard-state.js

      - name: Validate popup guard main-world JavaScript
        run: node --check extension/guard-main.js

      - name: Validate in-page notification JavaScript
        run: node --check extension/notify.js

      - name: Validate context target JavaScript
        run: node --check extension/context-target.js
