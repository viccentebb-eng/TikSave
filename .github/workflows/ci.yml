name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python
        run: python -m compileall -q app

      - name: Import application
        run: python -c "import app.main; import app.music; import app.dezoom; import app.native_image; import app.diagnostics; import app.analyzer; import app.image_tools"

      - name: Validate extension manifest
        run: python -m json.tool extension/manifest.json > /dev/null

      - name: Validate web JavaScript
        run: node --check app/static/app.js

      - name: Validate extension JavaScript
        run: node --check extension/popup.js

      - name: Validate floating helper JavaScript
        run: node --check extension/content.js

      - name: Validate extension background JavaScript
        run: node --check extension/background.js

      - name: Validate popup guard state JavaScript
        run: node --check extension/guard-state.js

      - name: Validate popup guard main-world JavaScript
        run: node --check extension/guard-main.js

      - name: Validate in-page notification JavaScript
        run: node --check extension/notify.js

      - name: Validate context target JavaScript
        run: node --check extension/context-target.js

      - name: Validate native image rules
        run: python -c "from app.native_image import generate_candidates; c=generate_candidates('https://i.pinimg.com/564x/aa/bb/cc/test.jpg'); assert any('/originals/' in x.url for x in c)"

      - name: Validate analyzer cache import
        run: python -c "import app.analyzer; assert app.analyzer.ANALYZE_CACHE_TTL > 0"

      - name: Validate floating image viewer JavaScript
        run: node --check extension/image-viewer.js

      - name: Validate social image scanner JavaScript
        run: node --check extension/social-images.js

      - name: Validate setup helper
        run: python -m app.setup_engines verify

      - name: Validate collection URL detection
        run: python -c "from app.downloader import detect_collection_type; assert detect_collection_type('https://www.tiktok.com/@revolutia.ai') == 'tiktok_profile'; assert detect_collection_type('https://www.tiktok.com/@revolutia.ai/video/123') is None; assert detect_collection_type('https://www.youtube.com/@OpenAI/videos') == 'youtube_channel'"

      - name: Validate AI chat exporter JavaScript
        run: node --check extension/chat-export.js

      - name: Validate Markdown chat storage
        run: python -c "import tempfile; from pathlib import Path; from app.chat_export import save_chat_markdown; p=Path(tempfile.mkdtemp()); r=save_chat_markdown(p, platform='chatgpt', title='Demo', source_url='https://chatgpt.com/c/demo', markdown='# Demo\n\n## Tú\n\nHola', message_count=1); assert Path(r['path']).exists(); assert 'platform: ChatGPT' in Path(r['path']).read_text(encoding='utf-8')"
