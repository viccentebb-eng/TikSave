<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><div class="mark">TS</div><div><h1>TikSave</h1><div id="site" class="site"></div></div></header>
    <p id="url">Leyendo pestaña…</p>
    <section id="dl" class="buttons hidden">
      <button data-mode="video" class="primary">Descargar video MP4</button>
      <div class="two">
        <button data-mode="mp3">Audio MP3</button>
        <button data-mode="audio">Audio original</button>
      </div>
      <button data-kit="1" title="Transcripción + ficha Markdown + portada">Kit para IA (texto + ficha)</button>
    </section>
    <section class="buttons">
      <div id="cap" class="hidden">
        <button id="capture">Capturar esta página</button>
        <div class="fmts" aria-label="Formatos de captura">
          <label><input type="checkbox" id="f-md" checked>Markdown</label>
          <label><input type="checkbox" id="f-docx">Word</label>
          <label><input type="checkbox" id="f-pdf">PDF</label>
          <label><input type="checkbox" id="f-html">HTML</label>
        </div>
        <div class="fine">Guarda lo que ves ahora en tu navegador, con tu sesión: sirve para ChatGPT, Gemini y páginas con login. Incluye fórmulas, código e imágenes.</div>
      </div>
      <button id="open" class="ghost">Abrir TikSave</button>
    </section>
    <div id="bar" class="track hidden"><div id="fill"></div></div>
    <div id="message" role="status"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
